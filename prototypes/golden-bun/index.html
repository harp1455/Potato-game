// ---- Drawing helpers ----------------------------------------------------------------------

function drawCrewBust(id, cx, cy, s, f = 'neutral') { // 임시 스탠딩: NAI 이미지가 들어오기 전까지 쓰는 그림

// ---- 이미지 슬롯: config.js 의 ART 에 적힌 파일만 불러온다 -------------------------------
const imgs = {};
function getImg(path) {

  const im = imgs[path];

}

let audio = null, muted = false;

}
function enterNode() {
  const v = state.vn, n = v.nodes[v.i];

  if (n && !n.c) v.last = n;
}
function vnText(n) { return fill(n.t || n.n || ''); }
function vnNext() {
  const v = state.vn, n = v.nodes[v.i];
  if (!n || n.c) return;
  const full = vnText(n).length;
  if (v.chars < full) { v.chars = full; return; }
  v.i++;
  if (v.i >= v.nodes.length) { const f = v.after; f(); return; }
  enterNode();
}

  const o = n.c[k], sv = state.save;
  if (o.aff && v.who) { sv.aff[v.who] += o.aff; v.gain += o.aff; }
  if (o.sta) sv.stamina = Math.min(5, sv.stamina + o.sta);
  if (o.flag) sv.flags[o.flag] = true;

}

  const sv = state.save, sum = state.sum, id = sum.partner, cr = STORY.crew[id];
  const list = STORY.events[id], ev = list[Math.min(sv.count[id], list.length - 1)];
  const high = GRADES.indexOf(sum.grade) >= GRADES.indexOf('A');
  const before = relIdx(sv.aff[id]);
  const full = { ...ev, nodes: ev.nodes.concat(high ? ev.bonus : []) };
  startVN(full, id, () => {
    const v = state.vn, after = relIdx(sv.aff[id]), R = STORY.rel;

      if (d.cone.s === 'run') { status = '초록에서 멈추기!'; prog = d.cone.t / tune.coneTime; pc = C.white; } else status = '눌러서 뽑기';
    }
    const icon = { grill: 'patty', fry: 'fries', drink: 'drink', cone: 'cone' }[id];
    ctx.globalAlpha = theirs || locked ? 0.45 : 1;
    if (id === 'fry' && d.fry.s === 'burnt') { ctx.filter = 'brightness(0.35)'; drawItem(icon, x + 82, y + 78, 0.8); ctx.filter = 'none'; }
    else drawItem(icon, x + 82, y + 78, 0.8);
    ctx.globalAlpha = 1;
    if (prog >= 0) {
      rr(x + 14, y + 118, 136, 14, 6, '#e8dcc4', C.ink, 2);
      if (id === 'cone' && !theirs) { rr(x + 14 + 136 * tune.coneLo, y + 118, 136 * (tune.coneHi - tune.coneLo), 14, 0, C.green, null); rr(x + 12 + 136 * Math.min(1, prog), y + 112, 6, 26, 2, C.ink, null); }
      else rr(x + 14, y + 118, Math.max(8, 136 * Math.min(1, prog)), 14, 6, pc, null);
    }
    text(status, x + 82, y + 150, 20, status.endsWith('!') ? C.red : C.brown, 'center', true);
    zone(id, x, y, 164, 172);
  });
  // HUD
  rr(0, 0, W, 92, 0, C.ink, null);
  const mins = sh.hour * 60 + Math.floor(d.time * tune.clockRate), hh = String(Math.floor(mins / 60) % 24).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
  text(`${day}일차 · ${sh.name}조 ${hh}:${mm}`, 20, 30, 24, C.white, 'left', true);
  text('체력', 20, 66, 20, C.cream, 'left'); for (let i = 0; i < 5; i++) drawArm(92 + i * 44, 66, 0.8, i < sv.stamina);
  const sc = rating(d);
  drawStar(350, 44, 30); text(gradeOf(sc), 350, 47, 26, C.ink, 'center', true);
  text(`${Math.round(sc)}점`, 420, 46, 24, C.white, 'center', true);
  text(won(d.income + d.tips), 620, 30, 26, C.yellow, 'right', true);
  text(`클레임 ${d.lost}`, 620, 66, 20, d.lost ? '#ff9c8a' : C.cream, 'right');
  rr(644, 16, 60, 60, 12, C.yellow); rr(662, 30, 8, 32, 2, C.ink, null); rr(678, 30, 8, 32, 2, C.ink, null); zone('pause', 636, 8, 76, 76);
  // 목표
  rr(0, 92, W, 44, 0, '#5a3a22', null);
  const p1 = tune.peak1Start, p2 = tune.peak2Start, t = d.time;
  const now = peak ? '지금: 피크타임 버티기' : t < p1 ? `지금: 피크까지 ${Math.ceil(p1 - t)}초` : t < p2 ? `지금: 피크까지 ${Math.ceil(p2 - t)}초` : t < d.len ? `지금: 마감까지 ${Math.ceil(d.len - t)}초` : '지금: 남은 손님 보내기';
  text(now, 16, 114, 20, C.white, 'left', true);
  text('오늘: A 이상', 420, 114, 20, C.cream, 'center');
  text(`이번 주: ${day}/3일`, 704, 114, 20, C.cream, 'right');
  // 손 안내
  const h = hintFor(d);
  if (h && zoneRects[h]) {
    const [x, y, w, hh2] = zoneRects[h], k = 4 + Math.sin(state.t * 8) * 4;
    rr(x - k, y - k, w + k * 2, hh2 + k * 2, 20, null, C.red, 7);
    rr(x + w / 2 - 44, y - 34 - k, 88, 34, 10, C.red, null); text('여기!', x + w / 2, y - 17 - k, 22, C.white, 'center', true);
  }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  const sc = scenes[scene];
  while (taps.length) { // 탭은 마지막으로 그린 화면의 영역으로 판정
    const p = taps.shift();
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      if (z.scene === scene && p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h) { scenes[scene].act(z.id); break; }
    }
  }
  for (const code in sc.keys) if (scene === sc.name && pressed(code)) scenes[scene].act(sc.keys[code]);
  scenes[scene].update(STEP); hit.clear();
}
for (const k in scenes) scenes[k].name = k;
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  zones = []; zoneRects = {};
  scenes[scene].draw();
  nameInput.style.display = scene === 'title' ? 'block' : 'none';
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
