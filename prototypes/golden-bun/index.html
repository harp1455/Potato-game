// ---- Loop: fixed step, frame time clamped ---------------------------------------------
let lastScene = null, fade = 0;
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  const sc = scenes[scene];
  while (taps.length) { // 탭은 마지막으로 그린 화면의 영역으로 판정
    const p = taps.shift();
    for (let i = zones.length - 1; i >= 0; i--) {
      const z = zones[i];
      if (z.scene === scene && p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h) { press[z.id] = 0.16; scenes[scene].act(z.id); break; }
    }
  }
  for (const code in sc.keys) if (scene === sc.name && pressed(code)) { press[sc.keys[code]] = 0.16; scenes[scene].act(sc.keys[code]); }
  scenes[scene].update(STEP); hit.clear();
  updateFx(STEP);
  if (scene !== lastScene) {
    const pausing = (lastScene === 'play' && scene === 'pause') || (lastScene === 'pause' && scene === 'play');
    fade = pausing ? 0 : 1; lastScene = scene; state.sceneT = 0;
  } else state.sceneT += STEP;
  if (fade > 0) fade = Math.max(0, fade - STEP * 3.5);
}
for (const k in scenes) scenes[k].name = k;
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  if (!JUA && document.fonts && document.fonts.check('20px Jua')) JUA = true;
  zones = []; zoneRects = {};
  scenes[scene].draw();
  drawFx();
  if (fade > 0) { ctx.globalAlpha = fade * fade; clear(C.sun); ctx.globalAlpha = 1; } // 화면이 바뀔 때 노란빛으로 넘어간다
  nameInput.style.display = scene === 'title' ? 'block' : 'none';
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

if (document.fonts && document.fonts.load) { document.fonts.load('20px Jua').catch(() => {}); document.fonts.load('20px "GB Title"', '골든번').catch(() => {}); } // 전용 폰트를 미리 불러 둔다
reset();
scene = params.get('scene') || 'title';
lastScene = scene;
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
